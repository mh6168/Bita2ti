<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operator request pending</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#111827;
      --text:#e5e7eb;
      --muted:#a3a3a3;
      --brand:#7c3aed;
      --brand2:#22c55e;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --card: rgba(255,255,255,.06);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 10% 10%, rgba(124,58,237,.35), transparent 55%),
        radial-gradient(800px 500px at 90% 20%, rgba(34,197,94,.25), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }
    .wrap{ max-width:900px; margin:0 auto; padding:28px 18px 70px; }

    .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .titlebox h1{ margin:0; font-size:26px; letter-spacing:-.5px; }
    .titlebox p{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }

    .card{
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:18px;
      overflow:hidden;
    }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:10px 14px; border-radius:12px; text-decoration:none;
      color:var(--text);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      font-weight:700;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.18); }

    .notice{
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(251,146,60,.35);
      background: rgba(251,146,60,.10);
      color: #fbbf24;
      font-weight:900;
      margin-top:12px;
    }

    .muted{ color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="titlebox">
        <h1>⏳ Operator request</h1>
        <p>Your request is waiting for admin review.</p>
      </div>
      <a href="/dashboard" class="btn">← Back to Dashboard</a>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px; font-size:18px; letter-spacing:-.2px;">Admin request pending</h2>
      <p th:text="${message}" class="notice"></p>
      <div class="muted" style="margin-top:12px; font-size:13px;">
        You can submit another request using the “Operator request” button on your dashboard if needed.
      </div>
    </div>
  </div>
</body>
</html>
