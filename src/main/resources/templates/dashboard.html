<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bita2ti Dashboard</title>
</head>
<body>

<h1>Welcome, <span th:text="${name}"></span> 👋</h1>

<h3>Your Digital ID:</h3>
<p style="font-weight:bold;" th:text="${digitalId}"></p>

<hr>

<!-- ========================= -->
<!-- AVAILABLE ORGANIZATIONS -->
<!-- ========================= -->
<h2>📡 Available Services</h2>

<form method="post" action="/subscribe">
    <select name="orgId">
        <option th:each="org : ${orgs}"
                th:value="${org.id}"
                th:text="${org.name + ' (' + org.type + ')'}">
        </option>
    </select>

    <button type="submit">Subscribe</button>
</form>

<hr>

<!-- ========================= -->
<!-- USER SUBSCRIPTIONS -->
<!-- ========================= -->
<h2>📄 My Services</h2>

<ul>
    <li th:each="sub : ${subscriptions}">
        <span th:text="${sub.organizationId}"></span>
        -
        <span style="color:green;">ACTIVE</span>
    </li>
</ul>

<hr>

<a href="/logout">Logout</a>

</body>
</html>
