<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Organization - Admin</title>
    <style>
        :root{
            --bg1:#0f172a;
            --bg2:#111827;
            --text:#e5e7eb;
            --muted:#a3a3a3;
            --brand:#7c3aed;
            --brand2:#22c55e;
            --shadow: 0 18px 50px rgba(0,0,0,.35);
            --card: rgba(255,255,255,.06);
        }
        *{ box-sizing:border-box; }
        body{
            margin:0;
            min-height:100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color:var(--text);
            background:
                radial-gradient(1000px 600px at 10% 10%, rgba(124,58,237,.35), transparent 55%),
                radial-gradient(800px 500px at 90% 20%, rgba(34,197,94,.25), transparent 55%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
        }

        .wrap{ max-width:900px; margin:0 auto; padding:28px 18px 70px; }

        .topbar{
            display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
            margin-bottom:20px;
        }
        .titlebox h1{ margin:0; font-size:26px; letter-spacing:-.5px; }
        .titlebox p{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }

        .btn{
            display:inline-flex; align-items:center; justify-content:center; gap:10px;
            padding:10px 14px; border-radius:12px; text-decoration:none;
            color:var(--text);
            border:1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04);
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
            font-weight:700;
        }
        .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.18); }

        .btn.back{
            border-color: rgba(255,255,255,.18);
            background: rgba(255,255,255,.03);
            box-shadow:none;
        }

        .card{
            background: linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
            border:1px solid rgba(255,255,255,.10);
            border-radius:18px;
            box-shadow: var(--shadow);
            padding:18px;
            overflow:hidden;
        }

        .section h2{ margin:0 0 12px; font-size:18px; letter-spacing:-.2px; }

        form{ margin-top:8px; }
        .field{ margin-bottom:14px; }

        label{
            display:block;
            font-weight:800;
            font-size:13px;
            margin-bottom:8px;
            color:rgba(255,255,255,.85);
        }

        input[type="text"], select{
            width:100%;
            padding:12px 12px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04);
            color:var(--text);
            outline:none;
        }

        /* Make dropdown list items visible (some browsers don't inherit text color well) */
        select{
            color:var(--text);
            background: rgba(255,255,255,.04);
            border:1px solid rgba(255,255,255,.12);
        }
        option{
            background: var(--bg2);
            color: var(--text);
        }
        /* Fallback for browsers that ignore option{color} */
        select:focus option{ color: var(--text); }


        input[type="text"]:focus, select:focus{
            border-color: rgba(124,58,237,.5);
            box-shadow: 0 0 0 5px rgba(124,58,237,.12);
        }


        .checkline{
            display:flex; align-items:center; gap:10px;
            padding:12px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.10);
            background: rgba(255,255,255,.03);
        }
        input[type="checkbox"]{
            width:18px; height:18px;
        }

        .actionsRow{ display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }

        .btn.submit{
            border-color: rgba(34,197,94,.40);
            background: linear-gradient(135deg, rgba(34,197,94,.25), rgba(34,197,94,.08));
            box-shadow: 0 0 0 5px rgba(34,197,94,.10);
        }

        .muted{ color:var(--muted); }

        @media (max-width: 520px){
            .topbar{ flex-direction:column; align-items:flex-start; }
            .actionsRow{ flex-direction:column; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="titlebox">
            <h1>➕ Add New Organization</h1>
            <p>Create an organization and control whether it’s approved for subscriptions.</p>
        </div>
        <div>
            <a class="btn back" href="/admin/dashboard">← Back to Dashboard</a>
        </div>
    </div>

    <div class="card section">
        <h2>Organization Details</h2>

        <form th:action="@{/admin/add-organization}" th:object="${organization}" method="post">
            <div class="field">
                <label for="name">Organization Name</label>
                <input type="text" th:field="*{name}" id="name" required placeholder="e.g. City University" />
            </div>

            <div class="field">
                <label for="type">Type</label>
                <select th:field="*{type}" id="type" required>
                    <option value="">Select Type</option>
                    <option value="Government">Government</option>
                    <option value="Private">Private Company</option>
                    <option value="University">University</option>
                    <option value="NGO">NGO</option>
                </select>
            </div>

            <input type="hidden" th:field="*{approved}" value="true" />


            <div class="actionsRow">
                <button type="submit" class="btn submit">✅ Create Organization</button>
                <a href="/admin/dashboard" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
