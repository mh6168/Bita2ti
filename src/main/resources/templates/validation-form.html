<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Digital ID Validator</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 100px auto; text-align: center; }
        input { padding: 15px; width: 80%; font-size: 18px; border: 2px solid #ddd; border-radius: 5px; }
        button { padding: 15px 30px; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        .service { font-size: 24px; color: #2c3e50; margin-bottom: 30px; }
        .logo { font-size: 48px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div th:if="${serviceName}">
        <div class="logo">🔍</div>
        <div class="service" th:text="${serviceName} + ' Validation'"></div>

        <form th:action="@{/validate/lookup}" method="get">
            <input type="hidden" th:name="subscriptionId" th:value="${subscriptionId}" />
            <input type="text" name="digitalId" placeholder="Enter Digital ID (EGY-XXXXXXXXXX)" required autofocus />
            <br><br>
            <button type="submit">Validate</button>
        </form>

    </div>

    <div th:unless="${serviceName}">
        <h1>Welcome to Bita2ti Validation Portal</h1>
        <p>Visit /validate/lookup?subscriptionId=[ID] for service-specific lookup.</p>
    </div>
</body>
</html>
