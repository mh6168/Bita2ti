<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Validation Result</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; text-align: center; }
        .status-registered { color: green; font-size: 24px; }
        .status-not { color: red; font-size: 24px; }
        .user-info { background: #f4f4f4; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .service { font-size: 28px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>🔍 Validation Result</h1>

    <div th:if="${subscribed}">
        <div class="service" th:text="${serviceName}"></div>
        <div class="status-registered">✅ REGISTERED</div>
        <div class="user-info">
            <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Digital ID:</strong> <span th:text="${user.digitalId}"></span></p>
        </div>
    </div>

    <div th:unless="${subscribed}">
        <div class="service" th:text="${serviceName}"></div>
        <div class="status-not">❌ NOT REGISTERED</div>
        <p>User not subscribed to this service.</p>
    </div>

    <a href="/">&larr; Back Home</a>
</body>
</html>
