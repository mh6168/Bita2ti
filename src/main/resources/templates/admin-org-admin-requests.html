<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Organization Admin Requests</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#111827;
      --text:#e5e7eb;
      --muted:#a3a3a3;
      --brand:#7c3aed;
      --brand2:#22c55e;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --card: rgba(255,255,255,.06);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 10% 10%, rgba(124,58,237,.35), transparent 55%),
        radial-gradient(800px 500px at 90% 20%, rgba(34,197,94,.25), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }
    .wrap{ max-width:1200px; margin:0 auto; padding:28px 18px 70px; }

    .topbar{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      margin-bottom:20px;
    }
    .titlebox h1{ margin:0; font-size:26px; letter-spacing:-.5px; }
    .titlebox p{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:10px 14px; border-radius:12px; text-decoration:none;
      color:var(--text);
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      font-weight:700;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.18); }
    .btn.primary{
      border-color: rgba(124,58,237,.45);
      background: linear-gradient(135deg, rgba(124,58,237,.22), rgba(124,58,237,.08));
      box-shadow: 0 0 0 5px rgba(124,58,237,.12);
    }
    .btn.approve{
      border-color: rgba(34,197,94,.35);
      background: linear-gradient(135deg, rgba(34,197,94,.22), rgba(34,197,94,.08));
    }
    .btn.reject{
      border-color: rgba(231,76,60,.35);
      background: linear-gradient(135deg, rgba(231,76,60,.18), rgba(231,76,60,.06));
    }

    .card{
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:18px;
      overflow:hidden;
    }

    .section h2{ margin:0 0 12px; font-size:18px; letter-spacing:-.2px; }

    form{ margin-top:8px; }
    label{ display:block; font-weight:800; font-size:13px; margin-bottom:8px; color:rgba(255,255,255,.85); }

    select{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
    }
    /* Make dropdown popup options readable */
    option{
      background: var(--bg2);
      color: var(--text);
    }


    select:focus{
      border-color: rgba(124,58,237,.5);
      box-shadow: 0 0 0 5px rgba(124,58,237,.12);
    }

    .actionsRow{ display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }

    table{ width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border-radius:14px; }
    th, td{ padding:12px 12px; text-align:left; border-bottom:1px solid rgba(255,255,255,.08); }
    th{ color: rgba(255,255,255,.75); font-size:13px; font-weight:800; background: rgba(255,255,255,.03); }
    tr:last-child td{ border-bottom:0; }

    .muted{ color:var(--muted); }
    @media (max-width: 720px){
      th:nth-child(2), td:nth-child(2){ display:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="titlebox">
        <h1>🧾 Organization Admin Requests</h1>
        <p>Approve or reject organization admin access requests.</p>
      </div>
      <div>
        <a href="/admin/dashboard" class="btn">← Back to Dashboard</a>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 12px; font-size:18px; letter-spacing:-.2px;">Filter by Organization</h2>

      <form th:action="@{/admin/organization-admin-requests}" method="get">
        <label>Organization</label>
        <select name="organizationId" required>
          <option value="" disabled th:selected="${selectedOrganizationId == null}">Select organization</option>
          <option th:each="org : ${organizations}"
                  th:value="${org.id}"
                  th:text="${org.name} + ' (' + ${org.type} + ')'">
          </option>
        </select>
        <div class="actionsRow">
          <button type="submit" class="btn primary">Load</button>
        </div>
      </form>

      <div th:if="${pending == null or pending.isEmpty()}" class="muted" style="margin-top:16px;">
        No pending requests.
      </div>

      <table th:if="${pending != null and !pending.isEmpty()}" style="margin-top:18px;">
        <thead>
          <tr>
            <th>User</th>
            <th>User ID</th>
            <th>Request ID</th>
            <th style="width:240px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="req : ${pending}">
            <td th:text="${userLabelById[req.userId] ?: ('User #' + req.userId)}"></td>
            <td th:text="${req.userId}"></td>
            <td th:text="${req.id}"></td>
            <td>
              <form method="post" th:action="@{/admin/organization-admin-requests/approve}" style="display:inline-block; margin-right:8px;">
                <input type="hidden" name="requestId" th:value="${req.id}" />
                <input type="hidden" name="organizationId" th:value="${selectedOrganizationId}" />
                <button type="submit" class="btn approve">✅ Approve</button>
              </form>



            </td>

          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
