<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latest Transactions - Admin</title>
    <style>
        :root{
          --bg1:#0f172a; --bg2:#111827; --text:#e5e7eb; --muted:#a3a3a3;
          --card: rgba(255,255,255,.06);
          --shadow: 0 18px 50px rgba(0,0,0,.35);
        }
        *{ box-sizing:border-box; }
        body{
          margin:0; min-height:100vh;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
          color:var(--text);
          background: linear-gradient(180deg, var(--bg1), var(--bg2));
        }
        .wrap{ max-width:1200px; margin:0 auto; padding:28px 18px 70px; }
        .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; }
        .titlebox h1{ margin:0; font-size:26px; letter-spacing:-.5px; }
        .titlebox p{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
        .btn{ display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:12px; text-decoration:none; color:var(--text); border:1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); font-weight:700; }
        .btn:hover{ background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.18); }
        .card{
          background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
          border:1px solid rgba(255,255,255,.10);
          border-radius:18px;
          box-shadow: var(--shadow);
          padding:18px;
        }
        table{ width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border-radius:14px; }
        th, td{ padding:12px 12px; text-align:left; border-bottom:1px solid rgba(255,255,255,.08); }
        th{ color: rgba(255,255,255,.75); font-size:13px; font-weight:800; background: rgba(255,255,255,.03); }
        tr:last-child td{ border-bottom:0; }
        .muted{ color:var(--muted); font-size:12px; }
        .backrow{ margin-top:14px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="titlebox">
            <h1>🧾 Latest Transactions</h1>
            <p>Newest → Oldest</p>
        </div>
        <div>
            <a class="btn" th:href="@{/admin/dashboard}">⬅ Back to Admin</a>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th style="width:20%;">Created At</th>
                <th style="width:60%;">Action</th>
                <th style="width:20%;">User</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.createdAt}"></td>
                <td th:text="${t.action}"></td>
                <td>
                    <span th:text="${userById != null and userById.containsKey(t.userId) ? userById.get(t.userId).fullName + ' (' + userById.get(t.userId).email + ')' : 'UserId=' + t.userId}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="3" class="muted">No transactions found.</td>
            </tr>
            </tbody>
        </table>

        <div class="backrow">
            <a class="btn" th:href="@{/admin/dashboard}">⬅ Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
