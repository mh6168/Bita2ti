<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up - Bita2ti</title>
    <style>
        :root{
            --bg1:#0f172a;
            --bg2:#111827;
            --card:rgba(255,255,255,.06);
            --card2:rgba(255,255,255,.09);
            --text:#e5e7eb;
            --muted:#a3a3a3;
            --brand:#7c3aed;
            --brand2:#22c55e;
            --ring: rgba(124,58,237,.35);
            --shadow: 0 18px 50px rgba(0,0,0,.35);
        }
        *{ box-sizing:border-box; }
        body{
            margin:0;
            min-height:100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color:var(--text);
            background:
                radial-gradient(1000px 600px at 10% 10%, rgba(124,58,237,.35), transparent 55%),
                radial-gradient(800px 500px at 90% 20%, rgba(34,197,94,.25), transparent 55%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px 16px;
        }
        .card{
            width:100%;
            max-width:520px;
            background: linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
            border:1px solid rgba(255,255,255,.10);
            border-radius:18px;
            box-shadow: var(--shadow);
            padding:24px;
            position:relative;
            overflow:hidden;
        }
        .card:before{
            content:"";
            position:absolute;
            inset:-2px;
            background:
                radial-gradient(600px 250px at 20% 0%, rgba(124,58,237,.25), transparent 60%),
                radial-gradient(500px 230px at 90% 20%, rgba(34,197,94,.18), transparent 60%);
            pointer-events:none;
        }
        .card > *{ position:relative; z-index:1; }

        .top{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:16px;
            margin-bottom:18px;
        }
        .title{
            margin:0;
            font-size:22px;
            letter-spacing:-.3px;
        }
        .subtitle{
            margin:6px 0 0;
            color:var(--muted);
            font-size:13px;
            line-height:1.5;
        }

        form{ margin-top:10px; }
        label{
            display:block;
            margin:14px 0 8px;
            font-size:13px;
            color:var(--muted);
        }
        input{
            width:100%;
            padding:12px 12px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04);
            color:var(--text);
            outline:none;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }
        input::placeholder{ color: rgba(255,255,255,.45); }
        input:focus{
            border-color: var(--ring);
            box-shadow: 0 0 0 5px rgba(124,58,237,.14);
            background: rgba(255,255,255,.06);
        }

        .actions{
            margin-top:18px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:center;
        }
        button{
            cursor:pointer;
            border:0;
            color:#fff;
            font-weight:700;
            padding:12px 16px;
            border-radius:12px;
            background: linear-gradient(135deg, rgba(124,58,237,1), rgba(34,197,94,.95));
            box-shadow: 0 10px 30px rgba(124,58,237,.20);
        }
        button:hover{ filter: brightness(1.02); }

        .link{
            color: rgba(255,255,255,.75);
            text-decoration:none;
            font-size:13px;
        }
        .link:hover{ text-decoration:underline; }

        .footer{
            margin-top:14px;
            color:rgba(255,255,255,.55);
            font-size:12px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="top">
        <div>
            <h1 class="title">Create your Bita2ti account</h1>
            <p class="subtitle">Get a digital ID and manage validation across organizations.</p>
        </div>
        <div>
            <a class="link" href="/login">← Back to login</a>
        </div>
    </div>

    <form method="post" action="/signup">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" name="fullName" placeholder="Your full name" required />

        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required />

        <div class="actions">
            <button type="submit">✨ Sign Up</button>
            <a class="link" th:href="@{/login}">Already have an account? Login</a>
        </div>
    </form>

    <div class="footer">
        By signing up, you agree to use Bita2ti for digital identity validation.
    </div>
</div>

</body>
</html>
